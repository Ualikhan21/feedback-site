<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Форма</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    margin: 0;
    padding: 40px 16px;
  }

  form {
    max-width: 560px;
    margin: 0 auto;
    background: #fff;
    padding: 24px 28px;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
  }

  h3 {
    margin-top: 0;
    color: #2c3e50;
    border-bottom: 2px solid #4a90d9;
    padding-bottom: 8px;
  }

  .field {
    margin-bottom: 18px;
  }

  .label {
    display: block;
    font-weight: bold;
    color: #34495e;
    margin-bottom: 6px;
  }

  input[type="password"],
  textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    border: 1px solid #b8c2cc;
    border-radius: 6px;
    font-size: 14px;
  }

  input[type="password"] {
    max-width: 160px;
  }

  textarea {
    resize: vertical;
    font-family: inherit;
  }

  .radio-row {
    display: block;
    padding: 4px 0;
    cursor: pointer;
  }

  .radio-row input {
    margin-right: 6px;
    accent-color: #4a90d9;
  }

  .buttons {
    display: flex;
    gap: 10px;
  }

  input[type="submit"],
  input[type="reset"] {
    padding: 9px 20px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    color: #fff;
  }

  input[type="submit"] {
    background: #4a90d9;
  }

  input[type="reset"] {
    background: #7f8c8d;
  }

  #status {
    margin-top: 15px;
  }
</style>
</head>

<body>

<form id="feedbackForm">

  <h3>Восстановление пароля</h3>

  <div class="field">
    <span class="label">
      Пароль (не более 10 символов):
    </span>

    <input
      type="password"
      id="password"
      name="pass"
      size="10"
      maxlength="10"
    >
  </div>

  <div class="field">
    <span class="label">
      Выберите номер вопроса:
    </span>

    <label class="radio-row">
      <input type="radio" name="question" value="1" checked>
      1. Девичья фамилия матери
    </label>

    <label class="radio-row">
      <input type="radio" name="question" value="2">
      2. Кличка домашнего животного
    </label>

    <label class="radio-row">
      <input type="radio" name="question" value="3">
      3. Любимое блюдо
    </label>
  </div>

  <div class="field">
    <span class="label">
      Ответ на вопрос:
    </span>

    <textarea
      id="answer"
      name="answer"
      rows="4"
      placeholder="Type here"
    ></textarea>
  </div>

  <div class="buttons">
    <input type="submit" value="Отправить">
    <input type="reset" value="Сбросить форму">
  </div>

  <div id="status"></div>

</form>

<script>
const form = document.getElementById("feedbackForm");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const password = document.getElementById("password").value;

    const question = document.querySelector(
        'input[name="question"]:checked'
    ).value;

    const answer = document.getElementById("answer").value;

    const status = document.getElementById("status");

    if (!password || !answer) {
        status.innerText = "Заполните все поля.";
        return;
    }

    status.innerText = "Отправка...";

    try {

        const response = await fetch(
            "https://feedback-telegram.uali-zhunisbek.workers.dev/",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    password: password,
                    question: question,
                    answer: answer
                })
            }
        );

        if (!response.ok) {
            throw new Error("Ошибка сервера: " + response.status);
        }

        status.innerText = "Форма успешно отправлена ✅";

        form.reset();

    } catch (error) {

        console.error(error);

        status.innerText = "Не удалось отправить форму ❌";
    }

});
</script>

</body>
</html>
